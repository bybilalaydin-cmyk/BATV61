<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#07090e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>NovaStream IPTV</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <style>
        :root { --bg: #07090e; --panel: #0d131f; --border: #1e293b; --accent: #06b6d4; --text: #f1f5f9; --muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 52px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; gap: 8px; flex-shrink: 0; }
        .row { display: flex; align-items: center; gap: 6px; }
        button { background: #1e293b; color: var(--text); border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
        button:active { opacity: 0.8; }
        button.primary { background: var(--accent); color: #041014; border-color: var(--accent); }
        button.danger { background: #4c0519; color: #fda4af; border-color: #881337; }
        
        .main { flex: 1; display: flex; position: relative; overflow: hidden; }
        aside { width: 290px; max-width: 85vw; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 20; }
        aside.closed { display: none; }
        
        .filters { padding: 8px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
        select, input { width: 100%; background: #07090e; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font-size: 12px; outline: none; }
        
        .ch-list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
        .ch-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; background: #111827; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
        .ch-item:hover { border-color: var(--accent); }
        .ch-info { overflow: hidden; padding-right: 6px; }
        .ch-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-meta { font-size: 10px; color: var(--muted); }
        
        .stage { flex: 1; padding: 6px; display: grid; gap: 6px; background: #000; position: relative; }
        .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .grid-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        .grid-3 { grid-template-columns: 1.3fr 1fr; grid-template-rows: 1fr 1fr; }
        .grid-3 .slot-0 { grid-row: span 2; }
        .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        
        @media (max-width: 700px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; grid-template-rows: repeat(auto-fit, minmax(0, 1fr)); }
            .grid-3 .slot-0 { grid-row: span 1; }
        }
        
        .slot { background: #0b0f19; border: 1.5px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .slot.active { border-color: var(--accent); }
        .slot-bar { height: 32px; background: #0f172a; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; border-bottom: 1px solid var(--border); }
        .slot-body { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .empty-msg { position: absolute; color: #64748b; font-size: 12px; text-align: center; padding: 12px; pointer-events: none; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
        .modal.hidden { display: none; }
        .modal-box { background: var(--panel); border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 400px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .file-label { display: block; border: 1.5px dashed #475569; border-radius: 8px; padding: 14px; text-align: center; font-size: 12px; cursor: pointer; color: #cbd5e1; }
        .hint { font-size: 11px; color: var(--muted); line-height: 1.4; }
    </style>
</head>
<body>

<header>
    <div class="row">
        <button id="menuBtn">☰ Kanallar</button>
        <strong style="font-size:14px; color:#06b6d4;">NovaStream</strong>
    </div>
    <div class="row">
        <button onclick="setGrid(1)" id="gBtn1" class="primary">1x1</button>
        <button onclick="setGrid(2)" id="gBtn2">2x1</button>
        <button onclick="setGrid(3)" id="gBtn3">1+2</button>
        <button onclick="setGrid(4)" id="gBtn4">2x2</button>
    </div>
    <div class="row">
        <button class="primary" onclick="openM('addModal')">+ Liste</button>
        <button onclick="openM('bakModal')">Yedek</button>
        <button onclick="toggleFS()">⛶</button>
    </div>
</header>

<div class="main">
    <aside id="sidebar">
        <div class="filters">
            <div class="row">
                <select id="accSelect" onchange="renderList()"><option value="ALL">Tüm Üyelikler</option></select>
                <button id="delAccBtn" class="danger" style="display:none;" onclick="delAccount()">Sil</button>
            </div>
            <select id="grpSelect" onchange="renderList()"><option value="ALL">Tüm Kategoriler</option></select>
            <input type="text" id="searchBox" oninput="renderList()" placeholder="Kanal adı ara...">
            <div class="row" style="justify-content:space-between; font-size:11px; color:var(--muted);">
                <span id="countTxt">0 kanal</span>
                <span id="favToggle" style="color:#fbbf24; cursor:pointer;" onclick="toggleFavFilter()">★ Favoriler</span>
            </div>
        </div>
        <div class="ch-list" id="chList"></div>
    </aside>

    <div class="stage grid-1" id="stage"></div>
</div>

<!-- Liste Ekle Modal -->
<div class="modal hidden" id="addModal">
    <div class="modal-box">
        <div class="modal-head">
            <span>M3U Listesi / Üyelik Ekle</span>
            <button onclick="closeM('addModal')">✕</button>
        </div>
        <input type="text" id="accName" placeholder="Liste Adı (Örn: Spor, Ev IPTV)">
        <div class="row">
            <input type="url" id="m3uUrl" placeholder="https://... M3U Bağlantısı">
            <button class="primary" id="urlLoadBtn" onclick="loadUrl()">Ekle</button>
        </div>
        <p class="hint">URL doğrudan veya proxy üzerinden çekilemezse linki indirip aşağıdan .m3u dosyası seçebilirsiniz.</p>
        <label class="file-label">
            Telefondan / Bilgisayardan <b>.m3u</b> Dosyası Seç
            <input type="file" accept=".m3u,.m3u8,.txt" style="display:none;" onchange="loadFile(event)">
        </label>
        <button onclick="loadDemo()">Ücretsiz Test Kanallarını Yükle</button>
    </div>
</div>

<!-- Yedek Modal -->
<div class="modal hidden" id="bakModal">
    <div class="modal-box">
        <div class="modal-head">
            <span>Yedekleme (JSON)</span>
            <button onclick="closeM('bakModal')">✕</button>
        </div>
        <button class="primary" onclick="exportJson()">Yedeği Cihaza İndir</button>
        <label class="file-label">
            Yedek Dosyası (.json) Geri Yükle
            <input type="file" accept=".json" style="display:none;" onchange="importJson(event)">
        </label>
    </div>
</div>

<script>
    let db = null;
    let app = { accounts: [], channels: [], favs: [], grid: 1, active: 0, solo: null, favOnly: false, slots: [null, null, null, null] };
    let players = [null, null, null, null];

    function initDB() {
        return new Promise(res => {
            const req = indexedDB.open('NovaStreamCleanDB', 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore('kv');
            req.onsuccess = e => { db = e.target.result; res(); };
            req.onerror = () => res();
        });
    }

    function save() {
        if (!db) return;
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put({ accounts: app.accounts, channels: app.channels, favs: app.favs, grid: app.grid, slots: app.slots }, 'state');
    }

    function load() {
        return new Promise(res => {
            if (!db) return res(null);
            const tx = db.transaction('kv', 'readonly');
            const r = tx.objectStore('kv').get('state');
            r.onsuccess = () => res(r.result);
            r.onerror = () => res(null);
        });
    }

    document.getElementById('menuBtn').onclick = () => {
        document.getElementById('sidebar').classList.toggle('closed');
    };

    function openM(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeM(id) { document.getElementById(id).classList.add('hidden'); }

    function parseM3U(txt, accId, accName) {
        const lines = txt.split(/\r?\n/);
        const out = [];
        let info = null;
        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            if (line.startsWith('#EXTINF:')) {
                const nm = line.match(/,(.*)$/);
                const gr = line.match(/group-title="([^"]*)"/i);
                info = { name: nm ? nm[1].trim() : 'Kanal', group: (gr && gr[1].trim()) ? gr[1].trim() : 'Genel' };
            } else if (!line.startsWith('#') && info) {
                out.push({ id: accId + '_' + out.length, accId, accName, name: info.name, group: info.group, url: line });
                info = null;
            }
        }
        return out;
    }

    function addPlaylist(txt, name) {
        const accId = 'a_' + Date.now();
        const chs = parseM3U(txt, accId, name);
        if (!chs.length) return alert('Liste içinde geçerli kanal bulunamadı.');
        app.accounts.push({ id: accId, name });
        app.channels = app.channels.concat(chs);
        save();
        updateFilters();
        renderList();
        closeM('addModal');
    }

    async function fetchTextWithFallback(url) {
        const attempts = [
            url,
            'https://corsproxy.io/?' + encodeURIComponent(url),
            'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
        ];
        let lastErr = null;
        for (const target of attempts) {
            try {
                const r = await fetch(target);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const txt = await r.text();
                if (txt && txt.trim().length > 10) return txt;
            } catch (e) {
                lastErr = e;
            }
        }
        throw lastErr || new Error('Bağlantı başarısız');
    }

    async function loadUrl() {
        const u = document.getElementById('m3uUrl').value.trim();
        const n = document.getElementById('accName').value.trim() || 'Liste ' + (app.accounts.length + 1);
        const btn = document.getElementById('urlLoadBtn');
        if (!u) return alert('Lütfen bir M3U bağlantısı girin.');
        btn.disabled = true;
        btn.textContent = '...';
        try {
            const txt = await fetchTextWithFallback(u);
            addPlaylist(txt, n);
        } catch {
            alert('Bu bağlantı sunucu kısıtlaması (CORS / ağ / HTTP) nedeniyle doğrudan çekilemedi. Bağlantıyı indirip ".m3u Dosyası Seç" ile yükleyebilirsiniz.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Ekle';
        }
    }

    function loadFile(e) {
        const f = e.target.files[0];
        if (!f) return;
        const n = document.getElementById('accName').value.trim() || f.name.replace(/\.[^/.]+$/, '');
        const rd = new FileReader();
        rd.onload = ev => addPlaylist(ev.target.result, n);
        rd.readAsText(f);
        e.target.value = '';
    }

    function loadDemo() {
        const demo = `#EXTM3U
#EXTINF:-1 group-title="Haber",DW English HD
https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8
#EXTINF:-1 group-title="Haber",France 24 English
https://stream.france24.com/hls/live/2037218/F24_EN_HI_HLS/master.m3u8
#EXTINF:-1 group-title="Test",Big Buck Bunny HD
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8`;
        addPlaylist(demo, 'Demo Kanallar');
    }

    function updateFilters() {
        const aSel = document.getElementById('accSelect');
        aSel.innerHTML = '<option value="ALL">Tüm Üyelikler</option>' + app.accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
        const gSel = document.getElementById('grpSelect');
        const grps = [...new Set(app.channels.map(c => c.group))].sort();
        gSel.innerHTML = '<option value="ALL">Tüm Kategoriler</option>' + grps.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
    }

    function delAccount() {
        const id = document.getElementById('accSelect').value;
        if (id === 'ALL') return;
        app.accounts = app.accounts.filter(a => a.id !== id);
        app.channels = app.channels.filter(c => c.accId !== id);
        save();
        updateFilters();
        renderList();
    }

    function toggleFavFilter() {
        app.favOnly = !app.favOnly;
        document.getElementById('favToggle').style.textDecoration = app.favOnly ? 'underline' : 'none';
        renderList();
    }

    function toggleFav(id, e) {
        e.stopPropagation();
        if (app.favs.includes(id)) app.favs = app.favs.filter(x => x !== id);
        else app.favs.push(id);
        save();
        renderList();
    }

    function renderList() {
        const acc = document.getElementById('accSelect').value;
        const grp = document.getElementById('grpSelect').value;
        const q = document.getElementById('searchBox').value.toLowerCase().trim();
        document.getElementById('delAccBtn').style.display = acc === 'ALL' ? 'none' : 'inline-block';

        const list = app.channels.filter(c => {
            if (acc !== 'ALL' && c.accId !== acc) return false;
            if (grp !== 'ALL' && c.group !== grp) return false;
            if (app.favOnly && !app.favs.includes(c.id)) return false;
            if (q && !c.name.toLowerCase().includes(q)) return false;
            return true;
        });

        document.getElementById('countTxt').textContent = list.length + ' kanal';
        const box = document.getElementById('chList');
        if (!list.length) {
            box.innerHTML = '<div style="padding:20px; text-align:center; font-size:12px; color:#64748b;">Kanal yok. Üstteki <b>+ Liste</b> butonundan M3U ekleyin.</div>';
            return;
        }
        box.innerHTML = list.slice(0, 250).map(c => {
            const isF = app.favs.includes(c.id);
            return `<div class="ch-item" onclick="playCh('${c.id}')">
                <div class="ch-info">
                    <div class="ch-name">${esc(c.name)}</div>
                    <div class="ch-meta">${esc(c.group)} • ${esc(c.accName)}</div>
                </div>
                <span onclick="toggleFav('${c.id}', event)" style="color:${isF ? '#fbbf24' : '#475569'}; font-size:16px; padding:0 4px;">★</span>
            </div>`;
        }).join('');
    }

    function setGrid(n) {
        app.grid = n;
        for (let i = 1; i <= 4; i++) {
            document.getElementById('gBtn' + i).className = (i === n) ? 'primary' : '';
        }
        if (app.active >= n) app.active = 0;
        buildStage();
        save();
    }

    function setSlotStatus(i, msg) {
        const el = document.getElementById('status_' + i);
        if (el) el.textContent = msg || '';
    }

    function buildStage() {
        const st = document.getElementById('stage');
        st.className = 'stage grid-' + app.grid;
        for (let i = app.grid; i < 4; i++) stopPlayer(i);
        st.innerHTML = '';

        for (let i = 0; i < app.grid; i++) {
            const ch = app.slots[i];
            const div = document.createElement('div');
            div.className = `slot slot-${i} ${app.active === i ? 'active' : ''}`;
            div.onclick = () => { app.active = i; document.querySelectorAll('.slot').forEach((s, idx) => s.classList.toggle('active', idx === i)); };
            div.innerHTML = `
                <div class="slot-bar">
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"><b>#${i + 1}</b> ${ch ? esc(ch.name) : 'Boş'}</span>
                    <div class="row">
                        <button style="padding:2px 6px; font-size:10px; ${app.solo === i ? 'background:#f59e0b; color:#000;' : ''}" onclick="toggleSolo(${i}, event)">SOLO</button>
                        ${ch ? `<button class="danger" style="padding:2px 6px; font-size:10px;" onclick="clearSlot(${i}, event)">✕</button>` : ''}
                    </div>
                </div>
                <div class="slot-body">
                    <video id="vid_${i}" controls playsinline></video>
                    <div class="empty-msg" id="status_${i}">${!ch ? 'Soldan kanal seçin' : 'Yayın bağlanıyor...'}</div>
                </div>`;
            st.appendChild(div);
            if (ch) startStream(i, ch.url);
        }
        applySolo();
    }

    function playCh(id) {
        const ch = app.channels.find(c => c.id === id);
        if (!ch) return;
        app.slots[app.active] = ch;
        save();
        buildStage();
        if (window.innerWidth < 700) document.getElementById('sidebar').classList.add('closed');
    }

    function clearSlot(i, e) {
        e.stopPropagation();
        stopPlayer(i);
        app.slots[i] = null;
        if (app.solo === i) app.solo = null;
        save();
        buildStage();
    }

    function stopPlayer(i) {
        if (players[i]) { try { players[i].destroy(); } catch {} players[i] = null; }
        const v = document.getElementById('vid_' + i);
        if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
    }

    function startStream(i, url) {
        stopPlayer(i);
        const v = document.getElementById('vid_' + i);
        if (!v) return;

        v.onplaying = () => setSlotStatus(i, '');
        v.onerror = () => setSlotStatus(i, 'Yayın açılamadı (format, CORS veya bağlantı hatası)');

        if (/\.ts(\?|$)/i.test(url) && window.mpegts && mpegts.getFeatureList().mseLivePlayback) {
            const p = mpegts.createPlayer({ type: 'mpegts', isLive: true, url });
            p.on(mpegts.Events.ERROR, () => setSlotStatus(i, 'TS akışı başlatılamadı'));
            p.attachMediaElement(v); p.load(); p.play().catch(() => setSlotStatus(i, 'Oynatmak için videoya dokunun'));
            players[i] = p;
        } else if (window.Hls && Hls.isSupported() && !v.canPlayType('application/vnd.apple.mpegurl')) {
            const h = new Hls({ enableWorker: true });
            h.loadSource(url); h.attachMedia(v);
            h.on(Hls.Events.MANIFEST_PARSED, () => {
                setSlotStatus(i, '');
                v.play().catch(() => setSlotStatus(i, 'Oynatmak için videoya dokunun'));
            });
            h.on(Hls.Events.ERROR, (_, data) => {
                if (data && data.fatal) setSlotStatus(i, 'HLS yayını yüklenemedi (CORS / kaynak hatası)');
            });
            players[i] = h;
        } else {
            v.src = url;
            v.play().catch(() => setSlotStatus(i, 'Oynatmak için videoya dokunun'));
        }
    }

    function toggleSolo(i, e) {
        e.stopPropagation();
        app.solo = (app.solo === i) ? null : i;
        buildStage();
    }

    function applySolo() {
        for (let i = 0; i < 4; i++) {
            const v = document.getElementById('vid_' + i);
            if (v) v.muted = (app.solo !== null && app.solo !== i);
        }
    }

    function toggleFS() {
        const st = document.getElementById('stage');
        if (!document.fullscreenElement) st.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
    }

    function exportJson() {
        const b = new Blob([JSON.stringify(app)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'novastream-yedek.json';
        a.click();
    }

    function importJson(e) {
        const f = e.target.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = ev => {
            try {
                const d = JSON.parse(ev.target.result);
                app.accounts = d.accounts || [];
                app.channels = d.channels || [];
                app.favs = d.favs || [];
                save(); updateFilters(); renderList(); closeM('bakModal');
            } catch { alert('Hatalı dosya.'); }
        };
        rd.readAsText(f);
    }

    function esc(s) { return String(s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

    (async () => {
        await initDB();
        const saved = await load();
        if (saved) Object.assign(app, saved);
        updateFilters();
        renderList();
        setGrid(app.grid || 1);
    })();
</script>
</body>
</html>
