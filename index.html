<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#07090e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="NovaStream IPTV">
    <meta name="description" content="Çoklu Üyelik ve Çoklu Pencere Destekli Web & Android IPTV Oynatıcı">
    <title>NovaStream IPTV - Web Oynatıcı</title>

    <link rel="manifest" href="./manifest.json">
    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js ve MPEGTS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <!-- Google Identity Services (Drive Yedekleme İçin) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #07090e;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        .grid-1x1 { display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .grid-2x1 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        .grid-1plus2 { display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: 1fr 1fr; }
        .grid-1plus2 > .slot-0 { grid-row: span 2; }
        .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        @media (max-width: 768px) {
            .grid-2x1, .grid-1plus2 { grid-template-columns: 1fr; grid-template-rows: repeat(auto-fit, minmax(0, 1fr)); }
            .grid-1plus2 > .slot-0 { grid-row: span 1; }
        }

        .player-slot {
            position: relative;
            background: #0b0f19;
            border: 1.5px solid #1e293b;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .player-slot.active-slot { border-color: #06b6d4; box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.4); }
        .player-slot.drag-over { border-color: #10b981; background: rgba(16, 185, 129, 0.08); }

        #playerStage:fullscreen {
            background: #000;
            padding: 4px;
            width: 100vw;
            height: 100vh;
        }
        #fsFloatingBar {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #fsFloatingBar.fs-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -16px);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- Üst Kontrol Çubuğu -->
    <header id="mainHeader" class="h-14 bg-[#0b0f19] border-b border-slate-800 px-3 flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2.5">
            <button id="toggleSidebarBtn" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-200" title="Kanal Listesi Aç/Kapat">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="flex items-center gap-2">
